author: SECBATON-GRIFFON
delete-after: true
changes:
- tweak: Starscreen shield capacitors now take draw from a cable knot beneath instead
    of from the room's APC.
- tweak: Starscreen shield generator and capacitor UIs can now be used with no room
    power, as the powernet now supplies it instead of the room's APC.
- tweak: Starscreen shield generator and capacitor UIs no longer use buttons for slowly
    increasing or decreasing values, they are now replaced with a user input for more
    precision. In addition, their data bars now show values inside them instead of
    elsewhere.
