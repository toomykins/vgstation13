author: west3436
delete-after: true
changes:
- bugfix: Fixed latejoin Deckhands spawning naked.
- bugfix: Removed broken gamemodes from Odyssey (revs, challengers, vampire, wizard).
- bugfix: Fixed "emergency shuttle" announcements wording on Odyssey.
- bugfix: Fixed the radstorm event not affecting any location on Odyssey.
- bugfix: Fixed not being able to cancel the bluespace jump before 2.5min.
- bugfix: Added a few missing pipes and wires to Odyssey.
- bugfix: Fixed exposed turfs within the shuttle turning into hyperspace turfs which
    would teleport players.
- bugfix: Fixed shuttle explosions on the shuttle exposing space while landed on a
    planet or at the outpost.
- bugfix: Fixed numerous shuttle floor bugs resulting in icon state changes and layering
    issues.
- bugfix: Fixed shuttles located in any non-outpost vlevel failing to initialize.
- bugfix: Fixed Vox Raiders spawning with a completely unusable shuttle.
- bugfix: Fixed invisible "sheet" items appearing in the loot tables.
- bugfix: Increased shuttle parking area size so docked shuttles don't hit the map
    edge.
- bugfix: Fixed all broken Odyssey events.
